<!-- Pantalla de registro de personas: envía el formulario a POST /persons -->
<h2>Registro de personas</h2>
<input id="a" placeholder="Nombre" />
<input id="b" placeholder="Edad" />
<button onclick="guardar()">Guardar</button>
<ul id="lista"></ul>
<script>
  // Carga y muestra las personas guardadas.
  async function cargar() {
    const datos = await (await fetch("/persons")).json();
    lista.innerHTML = datos
      .map((p) => `<li>${p.nombre} - ${p.edad} años</li>`)
      .join("");
  }
  // Envía la nueva persona a la API y refresca la lista.
  async function guardar() {
    const r = await fetch("/persons", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nombre: a.value, edad: b.value }),
    });
    if (!r.ok) alert((await r.json()).error);
    a.value = b.value = "";
    cargar();
  }
  cargar();
</script>
