<!-- Pantalla de registro de usuarios: envía el formulario a POST /users -->
<h2>Registro de usuarios</h2>
<input id="a" placeholder="Nombre" />
<input id="b" placeholder="Email" />
<button onclick="guardar()">Guardar</button>
<ul id="lista"></ul>
<script>
  // Carga y muestra los usuarios guardados.
  async function cargar() {
    const datos = await (await fetch("/users")).json();
    lista.innerHTML = datos
      .map((u) => `<li>${u.nombre} - ${u.email}</li>`)
      .join("");
  }
  // Envía el nuevo usuario a la API y refresca la lista.
  async function guardar() {
    const r = await fetch("/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nombre: a.value, email: b.value }),
    });
    if (!r.ok) alert((await r.json()).error);
    a.value = b.value = "";
    cargar();
  }
  cargar();
</script>
